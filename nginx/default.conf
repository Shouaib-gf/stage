limit_req_zone $binary_remote_addr zone=smartbus_auth:10m rate=10r/m;
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;

    server_name _;
    server_tokens off;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;

    server_name _;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $smartbus_upstream "web:80";

    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Smart Bus application
    location / {
        proxy_pass http://$smartbus_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location ^~ /api/session {
        limit_req zone=smartbus_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://$smartbus_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Grafana
    location /grafana/ {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Prometheus
    location /prometheus/ {
        auth_basic "SmartBus monitoring";
        auth_basic_user_file /etc/nginx/htpasswd/kibana;
        proxy_pass http://prometheus:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /kibana/ {
        auth_basic "SmartBus Kibana";
        auth_basic_user_file /etc/nginx/htpasswd/kibana;
        proxy_pass http://kibana:5601;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /metrics {
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://$smartbus_upstream;
        proxy_set_header Host $host;
    }
}
