x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - web
      - grafana
      - prometheus
      - kibana
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls/server.crt:/etc/nginx/tls/server.crt:ro
      - ./tls/server.key:/etc/nginx/tls/server.key:ro
      - ./tls/kibana.htpasswd:/etc/nginx/htpasswd/kibana:ro
    networks:
      - default
      - elk-internal

  mongo:
    image: mongo:8.2
    container_name: mongo
    restart: always
    logging: *default-logging
    command: ["mongod", "--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in the untracked .env file}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in the untracked .env file}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-iptsdb}
    volumes:
      - mongo_data:/data/db

  web:
    image: ${SMARTBUS_IMAGE:-smartbusbackend-web}
    build: .
    container_name: web-1
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - mongo
    environment:
      MONGO_URI: "${MONGO_URI:-mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DATABASE:-iptsdb}?authSource=admin}"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the untracked .env file}
      SMARTBUS_LOG_FILE: /var/log/smartbus/app.log
    expose:
      - "80"
    volumes:
      - ./logs:/var/log/smartbus

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.external-url=/prometheus/"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in the untracked .env file}
      GF_SERVER_DOMAIN: ${VM_HOST:-192.168.43.129}
      GF_SERVER_ROOT_URL: "https://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    logging: *default-logging
    command:
      - '--path.rootfs=/host'
    pid: host
    volumes:
      - '/:/host:ro,rslave'

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    logging: *default-logging
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.23
    container_name: elasticsearch
    restart: unless-stopped
    logging: *default-logging
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    mem_limit: 768m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - elk-internal

  elasticsearch-setup:
    image: curlimages/curl:8.12.1
    container_name: elasticsearch-setup
    restart: "no"
    logging: *default-logging
    depends_on:
      - elasticsearch
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until curl --fail --silent http://elasticsearch:9200/ >/dev/null; do sleep 3; done
        curl --fail --silent --show-error -X PUT http://elasticsearch:9200/_ilm/policy/smartbus-logs-7d -H 'Content-Type: application/json' -d '{"policy":{"phases":{"hot":{"actions":{}},"delete":{"min_age":"7d","actions":{"delete":{}}}}}}'
        curl --fail --silent --show-error -X PUT http://elasticsearch:9200/_index_template/smartbus-app -H 'Content-Type: application/json' -d '{"index_patterns":["smartbus-app-*"],"template":{"settings":{"number_of_replicas":0,"index.lifecycle.name":"smartbus-logs-7d"}}}'
        if curl --fail --silent http://elasticsearch:9200/_cat/indices/smartbus-app-* | grep -q smartbus-app-; then
          curl --fail --silent --show-error -X PUT http://elasticsearch:9200/smartbus-app-*/_settings -H 'Content-Type: application/json' -d '{"index":{"number_of_replicas":0}}'
        fi
    networks:
      - elk-internal

  logstash:
    image: docker.elastic.co/logstash/logstash:8.19.23
    container_name: logstash
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      elasticsearch-setup:
        condition: service_completed_successfully
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
      xpack.monitoring.enabled: "false"
    mem_limit: 512m
    volumes:
      - ./monitoring/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logs:/var/log/smartbus:ro
      - logstash_data:/usr/share/logstash/data
    networks:
      - elk-internal

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.23
    container_name: kibana
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      elasticsearch-setup:
        condition: service_completed_successfully
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      XPACK_SECURITY_ENABLED: "false"
      SERVER_HOST: 0.0.0.0
      SERVER_BASEPATH: /kibana
      SERVER_REWRITEBASEPATH: "true"
      SERVER_PUBLICBASEURL: "https://${VM_HOST:-192.168.43.129}/kibana"
      NODE_OPTIONS: "--max-old-space-size=512"
    mem_limit: 768m
    networks:
      - elk-internal

volumes:
  mongo_data:
  grafana_data:
  elasticsearch_data:
  logstash_data:

networks:
  elk-internal:
    internal: true
