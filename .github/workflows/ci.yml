name: SmartBus CI-CD

on:
  push:
    branches: [devops]
  pull_request:
    branches: [devops]
  workflow_dispatch:

concurrency:
  group: smartbus-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/shouaib-gf/smartbusbackend

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: node --check server.js && node --check app.js

      - name: Run automated tests
        run: npm test

      - name: Run code quality analysis
        run: npm run lint

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Build Docker image
        run: docker build -t smartbusbackend:validation .

  publish:
    needs: validate
    if: github.ref == 'refs/heads/devops' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish commit image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          image="${IMAGE_NAME}:${IMAGE_TAG}"

          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${IMAGE_TAG}" \
            -t "$image" .

          docker push "$image"

          echo "Published image: $image"

  deploy:
    needs: publish
    if: github.ref == 'refs/heads/devops' && github.event_name != 'pull_request'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Pull private GHCR image
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail

          image="${IMAGE_NAME}:${IMAGE_TAG}"

          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io \
              --username "$GHCR_USERNAME" \
              --password-stdin

          docker pull "$image"
          echo "Pulled image: $image"

      - name: Deploy backend with health check and rollback
        env:
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/shouaib/smartBusBackend

          image="${IMAGE_NAME}:${IMAGE_TAG}"
          docker image inspect "$image" >/dev/null

          # Preserve the exact currently running image before replacing web.
          previous_image="$(docker inspect --format '{{.Config.Image}}' web-1)"
          if [[ -z "$previous_image" ]]; then
            echo "Cannot identify the current web image; refusing deployment."
            exit 1
          fi

          docker image inspect "$previous_image" >/dev/null
          echo "Current backend image: $previous_image"

          if ! SMARTBUS_IMAGE="$image" docker compose up -d --no-deps --no-build web; then
            echo "Compose failed to start the new backend; restoring $previous_image."
            SMARTBUS_IMAGE="$previous_image" docker compose up -d --no-deps --no-build web
            exit 1
          fi

          healthy=false
          for _ in $(seq 1 18); do
            if curl --fail --silent --insecure https://127.0.0.1/health |
                 grep --quiet -E '"status"[[:space:]]*:[[:space:]]*"ok".*"database"[[:space:]]*:[[:space:]]*"connected"' &&
               curl --fail --silent --insecure https://127.0.0.1/ >/dev/null &&
               curl --fail --silent --insecure https://127.0.0.1/api-docs/ >/dev/null; then
              healthy=true
              break
            fi
            sleep 5
          done

          if [[ "$healthy" == true ]]; then
            echo "Deployment healthy: HTTPS /health, homepage, and /api-docs/ returned success."
            exit 0
          fi

          echo "New backend failed health checks; recent logs are omitted to protect sensitive details."
          docker inspect --format 'Container state={{.State.Status}} exit_code={{.State.ExitCode}} image={{.Config.Image}}' web-1 || true
          echo "Rolling back to $previous_image."

          SMARTBUS_IMAGE="$previous_image" docker compose up -d --no-deps --no-build web

          rollback_healthy=false
          for _ in $(seq 1 12); do
            if curl --fail --silent --insecure https://127.0.0.1/health |
                 grep --quiet -E '"status"[[:space:]]*:[[:space:]]*"ok".*"database"[[:space:]]*:[[:space:]]*"connected"' &&
               curl --fail --silent --insecure https://127.0.0.1/ >/dev/null &&
               curl --fail --silent --insecure https://127.0.0.1/api-docs/ >/dev/null; then
              rollback_healthy=true
              break
            fi
            sleep 5
          done

          if [[ "$rollback_healthy" == true ]]; then
            echo "Rollback restored the previous healthy backend."
          else
            echo "Rollback was attempted, but the previous backend did not pass health checks."
            docker inspect --format 'Container state={{.State.Status}} exit_code={{.State.ExitCode}} image={{.Config.Image}}' web-1 || true
          fi

          exit 1
