name: SmartBus CI

on:
  push:
    branches:
      - devops
  pull_request:
    branches:
      - devops
  workflow_dispatch:

jobs:
  validate:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: node --check server.js

      - name: Build Docker image
        run: docker build -t smartbusbackend:${{ github.sha }} .
