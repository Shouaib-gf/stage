input {
  file {
    id => "smartbus-application-events"
    path => "/var/log/smartbus/app.log*"
    mode => "tail"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/smartbus-sincedb"
    codec => json
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "smartbus-app-%{+YYYY.MM.dd}"
  }
}
